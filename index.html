<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>吉卜力美術館門票監控</title><style>
:root{color-scheme:light;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}body{background:#f5f6f2;color:#1c2c25;margin:0;padding:24px}main{max-width:740px;margin:35px auto}h1{font-size:clamp(24px,5vw,36px);margin-bottom:8px}p{line-height:1.7}.muted{color:#65736b}.card{background:white;border:1px solid #e0e5dd;border-radius:18px;padding:22px;margin:16px 0;box-shadow:0 5px 25px #173b2010}.status{font-size:24px;font-weight:750}.dates{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}.date{padding:12px;border:1px solid #dde4dc;border-radius:12px}.priority{border-color:#2e7153;background:#f2faf4}a.btn{display:inline-block;padding:12px 17px;background:#245b42;color:white;border-radius:10px;text-decoration:none;font-weight:650}small{color:#63746b}table{width:100%;border-collapse:collapse;font-size:13px}td,th{border-bottom:1px solid #e8ede8;text-align:left;padding:10px 6px}footer{font-size:12px;color:#63746b;margin-top:24px}
</style></head><body><main><p class="muted">GHIBLI MUSEUM · TICKET WATCH</p><h1>三鷹吉卜力美術館<br>門票監控</h1><p>目標：2026/12/9–12/14，優先 12/10，2 人同行。</p><section class="card"><p class="muted">最新監控狀態</p><div id="status" class="status">讀取中…</div><p id="detail" class="muted"></p><p id="checked" class="muted"></p><a class="btn" id="ticket" href="https://www.ghibli-museum.jp/en/tickets/" target="_blank" rel="noopener">前往官方購票頁面 ↗</a></section><section class="card"><h2>追蹤日期</h2><div id="dates" class="dates"></div><p><small>「疑似可預約」表示頁面有可預約字樣，並未確認可一次買到兩張。任何時段均需到官方頁面核實。</small></p></section><section class="card"><h2>最近檢查紀錄</h2><div style="overflow-x:auto"><table><thead><tr><th>檢查時間（台灣）</th><th>結果</th><th>Email</th></tr></thead><tbody id="history"><tr><td colspan="3">尚無資料</td></tr></tbody></table></div></section><footer>非 Lawson 官方服務。本網站不代訂、不儲存 Lawson 帳號或付款資料。GitHub Actions 定期檢查可能延遲，且網站防護可能阻止自動監控。</footer></main><script>
const names={possible:'發現疑似可預約訊號',no_confirmed:'未偵測到明確開放訊號',blocked:'無法讀取：可能遇到網站防護',error:'檢查失敗',unknown:'暫時無法判定'};
async function refresh(){try{const r=await fetch('./status.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('尚未完成第一次檢查');const s=await r.json();document.querySelector('#status').textContent=names[s.status]||'等待檢查';document.querySelector('#detail').textContent=s.note||'';document.querySelector('#checked').textContent=s.last_checked_utc?'上次檢查：'+new Date(s.last_checked_utc).toLocaleString('zh-TW',{timeZone:'Asia/Taipei'}):'尚未檢查';document.querySelector('#ticket').href=s.config.url;const dates=s.config.dates;document.querySelector('#dates').innerHTML=dates.map(d=>{const match=(s.found||[]).some(f=>f.date===d);return `<div class="date ${d===s.config.priority_date?'priority':''}"><strong>${d.slice(5)}</strong>${d===s.config.priority_date?' ⭐':''}<p>${match?'⚠️ 疑似可預約':'尚未確認有票'}</p></div>`}).join('');document.querySelector('#history').innerHTML=(s.history||[]).slice(0,20).map(h=>`<tr><td>${new Date(h.at).toLocaleString('zh-TW',{timeZone:'Asia/Taipei'})}</td><td>${names[h.status]||h.status}</td><td>${h.email||'—'}</td></tr>`).join('')||'<tr><td colspan="3">尚無紀錄</td></tr>';}catch(e){document.querySelector('#status').textContent='尚未取得監控資料';document.querySelector('#detail').textContent=e.message}}refresh();setInterval(refresh,60000);
</script></body></html>
